<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#334155"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#16A34A"/></marker><marker id="at" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#F59E0B"/></marker><filter id="ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.6" stdDeviation="2.6" flood-color="#0B1220" flood-opacity="0.13"/></filter><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEFEFF"/><stop offset="1" stop-color="#F2F6FB"/></linearGradient></defs><rect width="1080" height="760" fill="url(#bg)"/><rect x="34" y="28" width="5" height="26" rx="2.5" fill="#F59E0B"/><text x="50" y="44" font-family="Fraunces, Georgia, serif" font-size="21" fill="#0B1220" font-weight="700">Figure 6 — The round function F</text><text x="50" y="66" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="12.5" fill="#64748B">Confusion and diffusion, one step at a time (Shannon, 1949).</text><line x1="34" y1="80" x2="1046" y2="80" stroke="#CBD5E1" stroke-width="1.4"/><line x1="34" y1="80" x2="150" y2="80" stroke="#F59E0B" stroke-width="2.4"/><rect x="180" y="112" width="240" height="46" rx="8" fill="#DBEAFE" stroke="#1E5FD0" stroke-width="1.6" filter="url(#ds)"/><text x="300.0" y="139.33333333333334" font-family="Consolas, 'SF Mono', monospace" font-size="13" fill="#0B1220" text-anchor="middle" font-weight="600">Rᵢ₋₁  (64 bits)</text><line x1="300" y1="158" x2="300" y2="178" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="150" y="180" width="300" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="300" y="207" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="13.5" fill="#0B1220" text-anchor="middle" font-weight="700">1.  XOR round key Kᵢ</text><text x="300" y="227" font-family="Consolas, 'SF Mono', monospace" font-size="11.5" fill="#64748B" text-anchor="middle" font-weight="400">key mixing</text><rect x="460" y="198" width="118" height="30" rx="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="519" y="218" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11" fill="#7C3AED" text-anchor="middle" font-weight="700">confusion</text><line x1="300" y1="262" x2="300" y2="282" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="150" y="284" width="300" height="66" rx="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/><text x="300" y="311" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="13.5" fill="#0B1220" text-anchor="middle" font-weight="700">2.  S-box substitution</text><text x="300" y="331" font-family="Consolas, 'SF Mono', monospace" font-size="11.5" fill="#64748B" text-anchor="middle" font-weight="400">8 bytes → 8 bytes</text><rect x="460" y="302" width="118" height="30" rx="15" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/><text x="519" y="322" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11" fill="#F59E0B" text-anchor="middle" font-weight="700">CONFUSION</text><line x1="300" y1="366" x2="300" y2="386" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="150" y="388" width="300" height="66" rx="9" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="300" y="415" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="13.5" fill="#0B1220" text-anchor="middle" font-weight="700">3.  Rotate left rot ᵢ bits</text><text x="300" y="435" font-family="Consolas, 'SF Mono', monospace" font-size="11.5" fill="#64748B" text-anchor="middle" font-weight="400">1–7, key-dependent</text><rect x="460" y="406" width="118" height="30" rx="15" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/><text x="519" y="426" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11" fill="#16A34A" text-anchor="middle" font-weight="700">DIFFUSION</text><line x1="300" y1="470" x2="300" y2="490" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="150" y="492" width="300" height="66" rx="9" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text x="300" y="519" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="13.5" fill="#0B1220" text-anchor="middle" font-weight="700">4.  Byte permutation</text><text x="300" y="539" font-family="Consolas, 'SF Mono', monospace" font-size="11.5" fill="#64748B" text-anchor="middle" font-weight="400">PERM = 5 2 6 7 1 3 0 4</text><rect x="460" y="510" width="118" height="30" rx="15" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/><text x="519" y="530" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11" fill="#16A34A" text-anchor="middle" font-weight="700">DIFFUSION</text><line x1="300" y1="558" x2="300" y2="580" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="180" y="580" width="240" height="46" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.6" filter="url(#ds)"/><text x="300.0" y="607.3333333333334" font-family="Consolas, 'SF Mono', monospace" font-size="13" fill="#0B1220" text-anchor="middle" font-weight="600">F(Rᵢ₋₁, Kᵢ)</text><rect x="620" y="176" width="420" height="96" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2" filter="url(#ds)"/><line x1="620" y1="183" x2="620" y2="265" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/><text x="631" y="197" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">STEP 2 — CONFUSION.</text><text x="631" y="213" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">Substitution obscures the relationship between</text><text x="631" y="229" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">key, plaintext and ciphertext, and destroys</text><text x="631" y="245" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">statistical patterns. The table is key-derived,</text><text x="631" y="261" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">so the confusion itself depends on your key.</text><rect x="620" y="300" width="420" height="96" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2" filter="url(#ds)"/><line x1="620" y1="307" x2="620" y2="389" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/><text x="631" y="321" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">STEP 3 — the rotation floor.</text><text x="631" y="337" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">rot ∈ 1…7, never 0. A zero rotation would leave</text><text x="631" y="353" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">the round's diffusion resting on the byte</text><text x="631" y="369" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">permutation alone; the floor guarantees every</text><text x="631" y="385" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">round mixes ACROSS byte boundaries.</text><rect x="620" y="424" width="420" height="96" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2" filter="url(#ds)"/><line x1="620" y1="431" x2="620" y2="513" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/><text x="631" y="445" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">STEP 4 — a single 8-cycle derangement.</text><text x="631" y="461" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">0→5→3→7→4→1→2→6→0. No byte stays in its lane,</text><text x="631" y="477" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">and one cycle links all eight positions, so</text><text x="631" y="493" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">repeated rounds carry every byte to every</text><text x="631" y="509" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">position. Asserted in the test suite.</text><text x="620" y="580" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11" fill="#64748B" text-anchor="start" font-weight="700">THE BYTE PERMUTATION</text><rect x="620" y="592" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="642" y="613" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">0</text><rect x="620" y="682" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/><text x="642" y="703" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">0</text><rect x="672" y="592" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="694" y="613" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">1</text><rect x="672" y="682" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/><text x="694" y="703" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">1</text><rect x="724" y="592" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="746" y="613" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">2</text><rect x="724" y="682" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/><text x="746" y="703" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">2</text><rect x="776" y="592" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="798" y="613" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">3</text><rect x="776" y="682" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/><text x="798" y="703" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">3</text><rect x="828" y="592" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="850" y="613" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">4</text><rect x="828" y="682" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/><text x="850" y="703" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">4</text><rect x="880" y="592" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="902" y="613" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">5</text><rect x="880" y="682" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/><text x="902" y="703" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">5</text><rect x="932" y="592" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="954" y="613" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">6</text><rect x="932" y="682" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/><text x="954" y="703" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">6</text><rect x="984" y="592" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="1006" y="613" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#64748B" text-anchor="middle" font-weight="400">7</text><rect x="984" y="682" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/><text x="1006" y="703" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">7</text><path d="M 642 624 C 642 654, 902 650, 902 680" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M 694 624 C 694 654, 746 650, 746 680" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M 746 624 C 746 654, 954 650, 954 680" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M 798 624 C 798 654, 1006 650, 1006 680" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M 850 624 C 850 654, 694 650, 694 680" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M 902 624 C 902 654, 798 650, 798 680" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M 954 624 C 954 654, 642 650, 642 680" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M 1006 624 C 1006 654, 850 650, 850 680" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><text x="620" y="736" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#64748B" text-anchor="start" font-weight="400" font-style="italic">position i moves to position PERM[i] — a derangement with a single 8-cycle</text><text x="34" y="744" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="10.5" fill="#64748B">Bifurcate — a chaos-seeded Feistel cipher</text></svg>