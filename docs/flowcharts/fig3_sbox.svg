<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="656" viewBox="0 0 1020 656"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#334155"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#16A34A"/></marker><marker id="at" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#F59E0B"/></marker><filter id="ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.6" stdDeviation="2.6" flood-color="#0B1220" flood-opacity="0.13"/></filter><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEFEFF"/><stop offset="1" stop-color="#F2F6FB"/></linearGradient></defs><rect width="1020" height="656" fill="url(#bg)"/><rect x="34" y="28" width="5" height="26" rx="2.5" fill="#F59E0B"/><text x="50" y="44" font-family="Fraunces, Georgia, serif" font-size="21" fill="#0B1220" font-weight="700">Figure 3 — Key-derived S-box generation</text><text x="50" y="66" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="12.5" fill="#64748B">Fisher–Yates shuffle driven by the chaotic keystream.</text><line x1="34" y1="80" x2="986" y2="80" stroke="#CBD5E1" stroke-width="1.4"/><line x1="34" y1="80" x2="150" y2="80" stroke="#F59E0B" stroke-width="2.4"/><rect x="60" y="112" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.6" filter="url(#ds)"/><text x="180.0" y="133.0" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">sbox = [0, 1, 2, … 255]</text><text x="180.0" y="150.0" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="9" fill="#64748B" text-anchor="middle" font-weight="400">identity</text><line x1="180" y1="160" x2="180" y2="188" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="60" y="188" width="240" height="46" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.6" filter="url(#ds)"/><text x="180.0" y="208.0" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">i ← 255</text><text x="180.0" y="225.0" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="9" fill="#64748B" text-anchor="middle" font-weight="400">loop counter</text><line x1="180" y1="234" x2="180" y2="262" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="60" y="262" width="240" height="96" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/><text x="180" y="288" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">j ← keystream_byte() mod (i+1)</text><line x1="80" y1="302" x2="280" y2="302" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/><text x="180" y="326" font-family="Consolas, 'SF Mono', monospace" font-size="12.5" fill="#F59E0B" text-anchor="middle" font-weight="700">swap( sbox[i], sbox[j] )</text><text x="180" y="346" font-family="Consolas, 'SF Mono', monospace" font-size="11.5" fill="#64748B" text-anchor="middle" font-weight="400">i ← i − 1</text><path d="M 60 310 L 30 310 L 30 210 L 58 210" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><text x="24" y="178" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#F59E0B" text-anchor="start" font-weight="400" font-style="italic">while i &gt; 0</text><line x1="180" y1="358" x2="180" y2="388" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="60" y="388" width="240" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" filter="url(#ds)"/><text x="180.0" y="410.0" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="13" fill="#0B1220" text-anchor="middle" font-weight="600">256-byte S-box</text><text x="180.0" y="427.0" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="10" fill="#64748B" text-anchor="middle" font-weight="400">a bijection, by construction</text><rect x="356" y="200" width="430" height="112" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2" filter="url(#ds)"/><line x1="356" y1="207" x2="356" y2="305" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/><text x="367" y="221" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">PURPOSE — the novelty of Bifurcate.</text><text x="367" y="237" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">Classical ciphers ship ONE fixed substitution table</text><text x="367" y="253" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">for every user on earth. Here the table is grown from</text><text x="367" y="269" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">the key: change one passphrase character and ~99.6%</text><text x="367" y="285" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">of entries change (measured: 99.61%, matching the</text><text x="367" y="301" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">theoretical 255/256 for independent permutations).</text><rect x="356" y="340" width="430" height="80" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2" filter="url(#ds)"/><line x1="356" y1="347" x2="356" y2="413" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/><text x="367" y="361" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">NO INVERSE TABLE IS EVER NEEDED.</text><text x="367" y="377" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">In a Feistel network the round function F is never</text><text x="367" y="393" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">inverted (Figure 5), so an un-invertible chaotic</text><text x="367" y="409" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">S-box is safe here — removing an entire class of bug.</text><text x="60" y="486" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11" fill="#64748B" text-anchor="start" font-weight="700">EXAMPLE — first 16 entries for two passphrases differing by one character</text><text x="66" y="525" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11" fill="#F59E0B" text-anchor="start" font-weight="700">key A</text><rect x="122" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="144" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">6E</text><rect x="172" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="194" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">1B</text><rect x="222" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="244" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">C4</text><rect x="272" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="294" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">7A</text><rect x="322" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="344" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">03</text><rect x="372" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="394" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">F1</text><rect x="422" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="444" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">59</text><rect x="472" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="494" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">8D</text><rect x="522" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="544" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">22</text><rect x="572" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="594" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">B0</text><rect x="622" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="644" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">4E</text><rect x="672" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="694" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">D7</text><rect x="722" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="744" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">95</text><rect x="772" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="794" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">30</text><rect x="822" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="844" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">AC</text><rect x="872" y="500" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.3"/><text x="894" y="521" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">6B</text><text x="66" y="569" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11" fill="#7C3AED" text-anchor="start" font-weight="700">key B</text><rect x="122" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="144" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">D2</text><rect x="172" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="194" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">84</text><rect x="222" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="244" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">1F</text><rect x="272" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="294" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">60</text><rect x="322" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="344" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">BB</text><rect x="372" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="394" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">0A</text><rect x="422" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="444" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">E7</text><rect x="472" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="494" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">35</text><rect x="522" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="544" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">9C</text><rect x="572" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="594" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">48</text><rect x="622" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="644" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">F3</text><rect x="672" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="694" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">21</text><rect x="722" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="744" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">7D</text><rect x="772" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="794" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">CE</text><rect x="822" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="844" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">56</text><rect x="872" y="544" width="44" height="32" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="894" y="565" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">08</text><text x="122" y="596" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#64748B" text-anchor="start" font-weight="400" font-style="italic">every position differs — the table is not perturbed, it is regenerated</text><text x="34" y="640" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="10.5" fill="#64748B">Bifurcate — a chaos-seeded Feistel cipher</text></svg>