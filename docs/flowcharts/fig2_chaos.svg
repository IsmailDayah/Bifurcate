<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#334155"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#16A34A"/></marker><marker id="at" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#F59E0B"/></marker><filter id="ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.6" stdDeviation="2.6" flood-color="#0B1220" flood-opacity="0.13"/></filter><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEFEFF"/><stop offset="1" stop-color="#F2F6FB"/></linearGradient></defs><rect width="1080" height="720" fill="url(#bg)"/><rect x="34" y="28" width="5" height="26" rx="2.5" fill="#F59E0B"/><text x="50" y="44" font-family="Fraunces, Georgia, serif" font-size="21" fill="#0B1220" font-weight="700">Figure 2 — The chaotic engine</text><text x="50" y="66" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="12.5" fill="#64748B">Why the map is integer, and why its output is whitened before use.</text><line x1="34" y1="80" x2="1046" y2="80" stroke="#CBD5E1" stroke-width="1.4"/><line x1="34" y1="80" x2="150" y2="80" stroke="#F59E0B" stroke-width="2.4"/><rect x="60" y="112" width="260" height="50" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.6" filter="url(#ds)"/><text x="190.0" y="134.0" font-family="Consolas, 'SF Mono', monospace" font-size="13" fill="#0B1220" text-anchor="middle" font-weight="600">enc_seed  (32 B)</text><text x="190.0" y="151.0" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="10" fill="#64748B" text-anchor="middle" font-weight="400">from HKDF</text><line x1="190" y1="162" x2="190" y2="190" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="60" y="190" width="260" height="56" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.6" filter="url(#ds)"/><text x="190.0" y="215.0" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="600">Seed the state</text><text x="190.0" y="232.0" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="9" fill="#64748B" text-anchor="middle" font-weight="400">X₀ = int(seed[:4]) mod (S−2) + 1</text><line x1="190" y1="246" x2="190" y2="276" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="60" y="276" width="260" height="92" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="190" y="302" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="13.5" fill="#0B1220" text-anchor="middle" font-weight="700">Integer logistic map</text><text x="190" y="328" font-family="Consolas, 'SF Mono', monospace" font-size="13" fill="#F59E0B" text-anchor="middle" font-weight="600">X ← (R · X · (S − X)) ÷ (S · 2²⁰)</text><text x="190" y="350" font-family="Consolas, 'SF Mono', monospace" font-size="11" fill="#64748B" text-anchor="middle" font-weight="400">S = 2³²   R = round(3.99 × 2²⁰)</text><path d="M 60 322 L 32 322 L 32 400 L 190 400 L 190 372" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><text x="38" y="416" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#F59E0B" text-anchor="start" font-weight="400" font-style="italic">iterate ×8 between squeezes</text><rect x="372" y="276" width="250" height="92" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/><text x="497" y="302" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="13" fill="#0B1220" text-anchor="middle" font-weight="700">Degeneracy guard</text><text x="497" y="326" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">if X = 0 or X unchanged →</text><text x="497" y="346" font-family="Consolas, 'SF Mono', monospace" font-size="10.5" fill="#DC2626" text-anchor="middle" font-weight="400">re-inject SHA-256(ctr ‖ seed)</text><line x1="320" y1="322" x2="370" y2="322" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><path d="M 190 400 L 190 428" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><rect x="60" y="428" width="260" height="66" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6" filter="url(#ds)"/><text x="190.0" y="458.0" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="13" fill="#0B1220" text-anchor="middle" font-weight="600">SHA-256 sponge</text><text x="190.0" y="475.0" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="10" fill="#64748B" text-anchor="middle" font-weight="400">block = H(X ‖ ctr ‖ enc_seed)</text><line x1="190" y1="494" x2="190" y2="522" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><rect x="60" y="522" width="260" height="48" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.6" filter="url(#ds)"/><text x="190.0" y="550.3333333333334" font-family="Consolas, 'SF Mono', monospace" font-size="13" fill="#0B1220" text-anchor="middle" font-weight="600">keystream bytes</text><rect x="372" y="400" width="420" height="96" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2" filter="url(#ds)"/><line x1="372" y1="407" x2="372" y2="489" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/><text x="383" y="421" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">PURPOSE — determinism. A float logistic map is NOT</text><text x="383" y="437" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">bit-identical across platforms or Python builds. One</text><text x="383" y="453" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">differing bit makes decryption fail irrecoverably.</text><text x="383" y="469" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">Python ints are arbitrary-precision, so fixed-point</text><text x="383" y="485" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">integer arithmetic reproduces exactly, everywhere.</text><rect x="372" y="528" width="420" height="96" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2" filter="url(#ds)"/><line x1="372" y1="535" x2="372" y2="617" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/><text x="383" y="549" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">PURPOSE — whitening. Security must NOT rest on the</text><text x="383" y="565" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">statistics of a discretised map: the literature</text><text x="383" y="581" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">(Alvarez &amp; Li, 2006) shows naive chaos ciphers are</text><text x="383" y="597" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">frequently broken. Chaos supplies key-dependent</text><text x="383" y="613" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#334155" text-anchor="start" font-weight="400">STRUCTURE; SHA-256 supplies statistical QUALITY.</text><text x="60" y="646" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="11.5" fill="#64748B" text-anchor="start" font-weight="400" font-style="italic">Floating-point orbits are used only to DRAW the bifurcation diagram — never to key the cipher.</text><text x="34" y="704" font-family="Inter, 'Segoe UI', Calibri, sans-serif" font-size="10.5" fill="#64748B">Bifurcate — a chaos-seeded Feistel cipher</text></svg>